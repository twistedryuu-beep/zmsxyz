<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodboard</title>
<style>
:root{--bg:#fff;--tx:#37352f;--tx2:rgba(55,53,47,.65);--hv:rgba(55,53,47,.08);--bd:rgba(55,53,47,.16);--ac:#2383e2;--rd:#eb5757;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--tx:rgba(255,255,255,.81);--tx2:rgba(255,255,255,.46);--hv:rgba(255,255,255,.055);--bd:rgba(255,255,255,.13);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191919;--tx:rgba(255,255,255,.81);--tx2:rgba(255,255,255,.46);--hv:rgba(255,255,255,.055);--bd:rgba(255,255,255,.13);color-scheme:dark}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#shelf{height:100%;overflow:auto;box-sizing:border-box;padding:20px}
h1{margin:0 0 14px;font-size:22px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border-radius:10px;padding:10px;cursor:pointer;transition:background .15s}
.card:hover{background:var(--hv)}
.cover{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.card:hover .cover{transform:translateY(-3px)}
.cover img{position:absolute;left:10%;top:12%;width:80%;height:80%;object-fit:cover;border-radius:10px;background:var(--hv);box-shadow:0 1px 5px rgba(0,0,0,.3)}
.ph{width:80%;height:80%;border:1.5px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:22px}
.nm{margin-top:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{color:var(--tx2);font-size:12px}
#rows.v{flex-direction:row;align-items:stretch;justify-content:center}
#rows{height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.ic{vertical-align:-2px;margin-right:6px}
.row{touch-action:pan-y;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.row.v{touch-action:pan-x;-webkit-mask-image:linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;align-items:flex-start;will-change:transform;backface-visibility:hidden}
.it{flex:none;position:relative}
.it .stk{position:absolute;height:auto;object-fit:contain;border-radius:0;pointer-events:none;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.it img{display:block;width:100%;height:100%;object-fit:cover;border-radius:var(--r,12px);user-select:none;-webkit-user-drag:none}
.empty{text-align:center;color:var(--tx2);padding:0 24px}
button,.btn{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-block}
button:hover,.btn:hover{background:var(--hv)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.pri:hover{background:#0b6dcc}
.glass{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:0 4px 18px rgba(0,0,0,.22)}
.fade{transition:opacity .4s}
body.idle .fade{opacity:0;pointer-events:none}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:1px;padding:3px;border-radius:999px;z-index:6}
#bar button{border:0;border-radius:999px;padding:4px 11px;font-size:12px;line-height:1.4;white-space:nowrap}
#bar .ic{width:12px;height:12px;margin-right:4px;vertical-align:-1px}
#lb{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:var(--bg);touch-action:pan-y}
#lbi{max-width:calc(100% - 128px);max-height:calc(100% - 128px);object-fit:contain;border-radius:var(--r,12px);opacity:0;transition:opacity .25s;user-select:none;-webkit-user-drag:none}
#lbi.ok{opacity:1}
#lb button{background:var(--bg)}
#lb button:hover{background:color-mix(in srgb,var(--tx) 10%,var(--bg))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;padding:0;border-radius:50%;font-size:26px;line-height:1}
#lbp{left:14px}#lbn{right:14px}
#lbx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);border-radius:999px;padding:7px 18px}
#lbc{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);color:var(--tx2);font-size:12px;padding:4px 12px;border-radius:999px;background:var(--hv)}
.it{cursor:zoom-in}
@media(max-width:600px){#lbi{max-width:calc(100% - 16px)}.nav{width:38px;height:38px}#lbp{left:6px}#lbn{right:6px}}
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:min(340px,calc(100% - 16px));z-index:7;box-sizing:border-box;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#panel h2{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.lb{display:block;color:var(--tx2);font-size:12px;margin:12px 0 4px}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
#grid,#sgrid{display:grid;grid-template-columns:repeat(auto-fill,56px);gap:6px;margin:12px 0 10px}
#grid div,#sgrid div{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--hv)}
#sgrid img{object-fit:contain!important}
#grid img,#sgrid img{width:100%;height:100%;object-fit:cover}
#grid button,#sgrid button{position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;line-height:1;border-radius:50%;background:var(--bg);color:var(--rd);font-size:11px}
.sl{margin-top:14px}
.sl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sl-h label{color:var(--tx2);font-size:12px;font-weight:500}
.nb{display:flex;align-items:center;gap:3px;background:var(--hv);border:1px solid transparent;border-radius:8px;padding:2px 8px;transition:border-color .15s}
.nb:focus-within{border-color:var(--ac)}
.nb input{width:46px;border:0;background:transparent;color:var(--tx);font:inherit;font-size:12px;font-variant-numeric:tabular-nums;text-align:right;outline:0;padding:2px 0;-moz-appearance:textfield;appearance:textfield}
.nb input::-webkit-outer-spin-button,.nb input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nb em{font-style:normal;color:var(--tx2);font-size:11px;min-width:20px}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;--p:0%;outline:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--ac) var(--p),var(--bd) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:var(--bd)}
input[type=range]::-moz-range-progress{height:4px;border-radius:99px;background:var(--ac)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.35)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1.2);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent),0 1px 4px rgba(0,0,0,.35)}
.sec{margin:20px 0 0;padding-top:12px;border-top:1px solid var(--bd);color:var(--tx2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;cursor:pointer;font-size:13px}
.tg input{-webkit-appearance:none;appearance:none;flex:none;margin:0;width:34px;height:20px;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;transition:background .18s}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s}
.tg input:checked{background:var(--ac)}.tg input:checked::after{transform:translateX(14px)}
.seg{display:flex;background:var(--hv);border-radius:8px;padding:2px;gap:2px;margin-top:8px}
.seg button{flex:1;border:0;border-radius:6px;padding:4px 0;font-size:12px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
#del{color:var(--rd)}
.note{color:var(--tx2);font-size:12px;margin:12px 0 0;max-width:460px}.note a{color:var(--ac)}
.msg{color:var(--tx2);font-size:12px;margin:10px 0 0;min-height:18px}
</style>
</head>
<body>
<div id="shelf" hidden>
 <h1>Coleções</h1>
 <div id="cards"></div>
 <div class="line"><label class="btn pri">Importar coleções<input id="im" type="file" accept=".json,application/json" multiple hidden></label></div>
 <p class="note">Para criar arquivos de coleção (imagens, nome e ajustes), use o <a id="cl" target="_blank" rel="noopener">criador de coleções</a> e depois importe o arquivo aqui. Importar um arquivo com o mesmo identificador atualiza a coleção existente.</p>
 <p class="msg"></p>
</div>
<div id="rows" hidden></div>
<div id="bar" class="glass fade" hidden><button id="back" hidden aria-label="Voltar à estante">‹ Estante</button><button id="sh" aria-label="Embaralhar imagens"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Embaralhar</button><button id="gear" aria-label="Configurar coleção">✎ Editar</button></div>
<div id="lb" hidden><img id="lbi" alt=""><button id="lbx" class="fade" aria-label="Fechar">✕ Fechar</button><button id="lbp" class="nav fade" aria-label="Anterior">‹</button><button id="lbn" class="nav fade" aria-label="Próxima">›</button><div id="lbc" class="fade"></div></div>
<div id="panel" hidden>
 <h2>Configurações <button id="x" aria-label="Fechar">✕</button></h2>
 <label class="lb" for="nm">Nome</label><input id="nm" type="text" maxlength="60">
 <div id="grid"></div>
 <label class="btn pri">Adicionar imagens<input id="f" type="file" accept="image/*" multiple hidden></label>
 <div id="sl"></div>
 <div class="sec">Stickers</div>
 <div id="sgrid"></div>
 <label class="btn pri">Adicionar stickers<input id="sf" type="file" accept="image/*" multiple hidden></label>
 <div id="ssl"></div>
 <label class="tg"><span>Embaralhar sempre que abrir</span><input id="shk" type="checkbox"></label>
 <div class="line" style="margin-top:8px"><button id="shn"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Embaralhar agora</button></div>
 <div class="line"><button id="del">Excluir coleção</button></div>
 <p class="msg"></p>
</div>
<script>
const CREATOR_URL='https://twistedryuu-beep.github.io/zmsxyz/moodcreator.html';
const SLOT=new URLSearchParams(location.search).get('e')||'_',LK='moodboard:slots';
const slots=()=>{try{return JSON.parse(localStorage.getItem(LK)||'{}')||{}}catch(e){return {}}};
const saveLast=v=>{try{const o=slots();o[SLOT]=v;localStorage.setItem(LK,JSON.stringify(o))}catch(e){}},readLast=()=>slots()[SLOT]||'';
const Q=new URLSearchParams(location.search),$=s=>document.querySelector(s),BASE=location.origin+location.pathname;
const th=Q.get('theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
const DEF={speed:30,rows:2,h:0,r:12,shuf:0,rs:0,rv:50,vert:0,anim:0,az:18,stz:56,std:60,str:1};
const UN={speed:'px/s',rows:'',h:'px',r:'px',rv:'%',az:'%',stz:'px',std:'%'};
let db,cols=[],items=[],stickers=[],cur=null,S={...DEF},urls=[],tracks=[],raf,last=0,paused=false,fromShelf=false,lbI=-1,lbU=null,idleT;
const msg=t=>document.querySelectorAll('.msg').forEach(e=>e.textContent=t||'');
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('moodboard',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('imgs'))d.createObjectStore('imgs',{keyPath:'id',autoIncrement:true}).createIndex('c','c');if(!d.objectStoreNames.contains('cols'))d.createObjectStore('cols',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(st,m,f)=>new Promise((ok,no)=>{const t=db.transaction(st,m),r=f(t.objectStore(st));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('abort'))});
const distinct=()=>new Promise(ok=>{const o=[],r=db.transaction('imgs').objectStore('imgs').index('c').openKeyCursor(null,'nextunique');r.onsuccess=()=>{const c=r.result;if(c){o.push(c.key);c.continue()}else ok(o)};r.onerror=()=>ok(o)});
const dims=async b=>{try{const m=await createImageBitmap(b),r=[m.width||1,m.height||1];m.close&&m.close();return r}catch(e){}return new Promise(ok=>{const u=URL.createObjectURL(b),i=new Image(),d=a=>{URL.revokeObjectURL(u);ok(a)};i.onload=()=>d([i.naturalWidth||1,i.naturalHeight||1]);i.onerror=()=>d([1,1]);i.src=u;setTimeout(()=>d([1,1]),6000)})};
const b2d=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
const d2b=d=>{const[h,s]=d.split(','),a=atob(s),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return new Blob([u],{type:h.slice(5,h.indexOf(';'))})};
const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'colecao';
const pic=(im,it)=>{im.src=U(it.blob)};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}};
const U=b=>{const u=URL.createObjectURL(b);urls.push(u);return u};
const save=()=>tx('cols','readwrite',s=>s.put(cur));
function cleanup(){cancelAnimationFrame(raf);urls.forEach(u=>URL.revokeObjectURL(u));urls=[];tracks=[]}
function view(v){$('#shelf').hidden=v!=='shelf';$('#rows').hidden=v!=='coll';$('#bar').hidden=v!=='coll';$('#back').hidden=v!=='coll';$('#panel').hidden=true;msg();wake()}

async function loadCols(){
 cols=(await tx('cols','readonly',s=>s.getAll()))||[];
 for(const id of await distinct())if(!cols.some(c=>c.id===id)){const c={id,name:id,...DEF,t:Date.now()};await tx('cols','readwrite',s=>s.put(c));cols.push(c)}
 cols.sort((a,b)=>a.t-b.t);
}
async function shelf(){
 cleanup();cur=null;saveLast('');view('shelf');
 const g=$('#cards'),T=[[0,0,0],[-9,-5,-7],[9,-3,6],[-3,-9,-12]];g.innerHTML='';
 for(const c of cols){
  const all=((await tx('imgs','readonly',s=>s.index('c').getAll(c.id)))||[]).filter(x=>!x.s),n=all.length,ims=all.slice(0,4);
  const d=document.createElement('div'),cv=document.createElement('div'),nm=document.createElement('div'),ct=document.createElement('div');
  d.className='card';cv.className='cover';nm.className='nm';ct.className='ct';nm.textContent=c.name;ct.textContent=n+(n===1?' imagem':' imagens');
  if(!ims.length)cv.innerHTML='<div class="ph">vazia</div>';
  ims.forEach((it,i)=>{const im=new Image(),[x,y,a]=T[i];pic(im,it);im.alt='';im.style.cssText='z-index:'+(9-i)+';transform:translate('+x+'%,'+y+'%) rotate('+a+'deg)';cv.append(im)});
  d.append(cv,nm,ct);d.onclick=()=>openCol(c.id,true);g.append(d);
 }
 const nw=document.createElement('div');nw.className='card';nw.innerHTML='<div class="cover"><div class="ph">+</div></div><div class="nm">Nova coleção</div>';
 nw.onclick=()=>{if(nw.querySelector('input'))return;const i=document.createElement('input');i.type='text';i.maxLength=60;i.placeholder='Nome da coleção';nw.querySelector('.nm').replaceWith(i);i.focus();i.onkeydown=e=>{if(e.key==='Enter')create(i.value)};i.onblur=()=>{if(!i.value.trim())shelf()}};
 g.append(nw);
}
async function create(name){
 name=name.trim();if(!name)return;
 const b=slug(name);let id=b,n=2;while(cols.some(c=>c.id===id))id=b+'-'+n++;
 const c={id,name,...DEF,t:Date.now()};await tx('cols','readwrite',s=>s.put(c));cols.push(c);openCol(id,true,true);
}
async function openCol(id,fs,edit){
 cur=cols.find(c=>c.id===id);
 if(!cur){cur={id,name:id,...DEF,t:Date.now()};await tx('cols','readwrite',s=>s.put(cur));cols.push(cur)}
 for(const k in DEF)if(cur[k]===undefined)cur[k]=DEF[k];fromShelf=!!fs;saveLast(cur.id);cleanup();view('coll');apply();
 $('#nm').value=cur.name;buildSl();buildSt();$('#shk').checked=!!cur.shuf;
 await reload();if(edit)$('#panel').hidden=false;
}
async function reload(){const id=cur.id;const all=(await tx('imgs','readonly',s=>s.index('c').getAll(id)))||[];items=all.filter(x=>!x.s);stickers=all.filter(x=>x.s);if(S.shuf)shuf(items);render();grid();sgrid();migrate(id)}
async function migrate(id){for(const it of items.filter(x=>x.t)){delete it.t;await tx('imgs','readwrite',st=>st.put(it))}}
function apply(){for(const k in DEF){const q=Q.get(k);S[k]=q!==null&&q!==''&&!isNaN(+q)?+q:(cur[k]??DEF[k])}}
const change=k=>{apply();if(k!=='speed')render()};
function mk(k,l,a,z,st){
 const r=document.createElement('div');r.className='sl';r.dataset.k=k;
 r.innerHTML='<div class="sl-h"><label></label><div class="nb"><input type="number" inputmode="decimal"><em></em></div></div><input type="range">';
 const lab=r.querySelector('label'),n=r.querySelector('.nb input'),em=r.querySelector('em'),g=r.querySelector('input[type=range]');
 lab.textContent=l;n.id='n-'+k;lab.htmlFor=n.id;
 [n,g].forEach(e=>{e.min=a;e.max=z;e.step=st});
 r._paint=()=>{const m=+g.max,mn=+g.min;g.style.setProperty('--p',Math.max(0,Math.min(100,(cur[k]-mn)/((m-mn)||1)*100))+'%');em.textContent=k==='h'&&!cur[k]?'auto':UN[k]};
 const put=(v,c)=>{cur[k]=v;n.value=v;g.value=v;r._paint();change(k);if(c)save()};
 n.value=g.value=cur[k];r._paint();
 g.oninput=()=>put(+g.value);g.onchange=save;
 n.onchange=()=>{let v=parseFloat(n.value);if(isNaN(v))v=cur[k];v=Math.round(Math.max(+n.min,Math.min(+n.max,v))/st)*st;put(v,true)};
 n.onkeydown=e=>{if(e.key==='Enter')n.blur()};
 return r;
}
function tg(label,k,after){
 const l=document.createElement('label'),sp=document.createElement('span'),i=document.createElement('input');
 l.className='tg';sp.textContent=label;i.type='checkbox';i.checked=!!cur[k];l.append(sp,i);
 i.onchange=()=>{cur[k]=i.checked?1:0;after&&after();change(k);save()};return l;
}
function buildSl(){
 const b=$('#sl');b.innerHTML='';
 [['speed','Velocidade',0,150,1],['rows','Fileiras',1,4,1],['h','Tamanho',0,400,10],['r','Cantos',0,40,1]].forEach(x=>b.append(mk(...x)));
 const lr=()=>{b.querySelector('[data-k=rows] label').textContent=cur.vert?'Colunas':'Fileiras'};lr();
 const rv=mk('rv','Variação de tamanho',0,100,1);rv.hidden=!cur.rs;
 b.append(tg('Rolagem vertical','vert',lr),tg('Tamanhos aleatórios','rs',()=>{rv.hidden=!cur.rs}),rv);
 const h=document.createElement('div');h.className='sec';h.textContent='Animação de entrada e saída';b.append(h);
 const az=mk('az','Alcance do fade',5,40,1),sg=document.createElement('div');sg.className='seg';az.hidden=!cur.anim;
