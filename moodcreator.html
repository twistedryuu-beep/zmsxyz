<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criador de coleções</title>
<style>
:root{--bg:#fff;--tx:#37352f;--tx2:rgba(55,53,47,.65);--hv:rgba(55,53,47,.08);--bd:rgba(55,53,47,.16);--ac:#2383e2;--rd:#eb5757;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--tx:rgba(255,255,255,.81);--tx2:rgba(255,255,255,.46);--hv:rgba(255,255,255,.055);--bd:rgba(255,255,255,.13);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:max(20px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}
main{max-width:680px;margin:0 auto}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--tx2);margin:0 0 22px}
.lb{display:block;color:var(--tx2);font-size:12px;margin:16px 0 4px}
input[type=text]{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
input[type=text]:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);border-color:var(--ac)}
button,.btn{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-block}
button:hover,.btn:hover{background:var(--hv)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.pri:hover{background:#0b6dcc}
button:disabled{opacity:.4;cursor:not-allowed}
#drop{margin-top:16px;border:1.5px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--tx2);transition:background .15s,border-color .15s}
#drop.on{background:var(--hv);border-color:var(--ac)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:14px}
#grid div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--hv);background-image:linear-gradient(45deg,var(--hv) 25%,transparent 25%,transparent 75%,var(--hv) 75%),linear-gradient(45deg,var(--hv) 25%,transparent 25%,transparent 75%,var(--hv) 75%);background-size:14px 14px;background-position:0 0,7px 7px}
#grid img{width:100%;height:100%;object-fit:cover;display:block}
#grid button{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;border-radius:50%;background:var(--bg);color:var(--rd);font-size:11px;line-height:1}
.info{color:var(--tx2);font-size:12px;margin-top:8px}
.sl{display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;margin-top:8px}
.sl span:last-child{color:var(--tx2);text-align:right;font-size:12px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;cursor:pointer}
.act{margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{color:var(--tx2);font-size:13px;min-height:20px}
#pv{--r:12px;height:360px;margin-top:8px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg)}
.row{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.track{display:flex;will-change:transform;backface-visibility:hidden}
.it{flex:none;margin-right:12px;border-radius:var(--r);overflow:hidden}
.it img{display:block;width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--tx2);padding:0 24px}
.note a{color:var(--ac)}
</style>
</head>
<body>
<main>
 <h1>Criador de coleções</h1>
 <p class="sub">Monte uma coleção e baixe o arquivo para importar no seu moodboard.</p>

 <label class="lb" for="nm">Nome da coleção</label>
 <input id="nm" type="text" maxlength="60" placeholder="Ex.: Sapinhos">
 <div id="drop"><label class="btn pri">Adicionar imagens<input id="f" type="file" accept="image/*" multiple hidden></label><div style="margin-top:8px">ou arraste e solte aqui · GIFs animados e PNGs transparentes são mantidos</div></div>
 <div id="grid"></div>
 <div class="info" id="cnt">Nenhuma imagem ainda.</div>

 <label class="lb">Ajustes padrão da coleção</label>
 <div id="sl"></div>
 <label class="chk"><input id="shk" type="checkbox"> Embaralhar sempre que abrir</label>

 <label class="lb">Pré-visualização</label>
 <div id="pv"></div>
 <div class="info">Prévia em altura fixa; no moodboard o tamanho automático acompanha a tela.</div>

 <div class="act"><button id="dl" class="pri" disabled>Baixar coleção</button><span class="msg" id="msg"></span></div>
</main>
<script>
const $=s=>document.querySelector(s);
const DEF={speed:30,rows:2,h:0,r:12};
const SL=[['speed','Velocidade',0,150,1,v=>v+' px/s'],['rows','Fileiras',1,4,1,v=>v],['h','Tamanho',0,400,10,v=>v?v+' px':'auto'],['r','Cantos',0,40,1,v=>v+' px']];
const S={...DEF};let imgs=[];
const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const dims=async(f,u)=>{try{const m=await createImageBitmap(f),r=[m.width||1,m.height||1];m.close&&m.close();return r}catch(e){}
 return new Promise(ok=>{const i=new Image();i.onload=()=>ok([i.naturalWidth||1,i.naturalHeight||1]);i.onerror=()=>ok([1,1]);i.src=u;setTimeout(()=>ok([1,1]),6000)})};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}};
let ord=[],pvRaf,pvT=[],pvLast=0;
const reorder=()=>{ord=imgs.map((_,i)=>i);if($('#shk').checked)shuf(ord)};
const b2d=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(b)});
const msg=t=>$('#msg').textContent=t||'';

SL.forEach(([k,l,a,z,st,f])=>{
 const r=document.createElement('div'),t=document.createElement('span'),i=document.createElement('input'),o=document.createElement('span');
 r.className='sl';t.textContent=l;i.type='range';i.min=a;i.max=z;i.step=st;i.value=S[k];o.textContent=f(S[k]);
 i.oninput=()=>{S[k]=+i.value;o.textContent=f(S[k]);if(k==='r')$('#pv').style.setProperty('--r',S.r+'px');else if(k!=='speed')pv()};r.append(t,i,o);$('#sl').append(r);
});

function refresh(){
 const g=$('#grid');g.innerHTML='';
 imgs.forEach((m,i)=>{const d=document.createElement('div'),im=new Image(),b=document.createElement('button');im.src=m.url;im.alt='';b.textContent='✕';b.title='Remover';b.onclick=()=>{URL.revokeObjectURL(m.url);imgs.splice(i,1);reorder();refresh()};d.append(im,b);g.append(d)});
 const mb=imgs.reduce((a,m)=>a+m.f.size,0)/1048576;
 $('#cnt').textContent=imgs.length?imgs.length+(imgs.length===1?' imagem':' imagens')+' · '+mb.toFixed(1)+' MB'+(mb>60?' — arquivo grande, a importação pode demorar':''):'Nenhuma imagem ainda.';
 $('#dl').disabled=!imgs.length||!$('#nm').value.trim()||!slug($('#nm').value);
 if(refresh.n!==imgs.length){refresh.n=imgs.length;pv()}
}
async function add(files){
 const fs=[...files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return msg('Nenhuma imagem válida.');
 for(let i=0;i<fs.length;i++){msg('Lendo '+(i+1)+' de '+fs.length+'…');const u=URL.createObjectURL(fs[i]),[w,h]=await dims(fs[i],u);imgs.push({f:fs[i],url:u,w,h})}
 msg('');reorder();refresh();
}
$('#f').onchange=e=>{const f=[...e.target.files];e.target.value='';add(f)};
$('#nm').oninput=refresh;$('#shk').onchange=()=>{reorder();pv()};
const dz=$('#drop');
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.classList.remove('on')}));
addEventListener('drop',e=>add(e.dataTransfer.files));

$('#dl').onclick=async()=>{
 const name=$('#nm').value.trim(),id=slug(name);
 $('#dl').disabled=true;
 try{
  const head={v:3,type:'collection',name,id,speed:S.speed,rows:S.rows,h:S.h,r:S.r,shuf:$('#shk').checked?1:0},parts=[JSON.stringify(head).slice(0,-1)+',"images":['];
  for(let i=0;i<imgs.length;i++){msg('Preparando '+(i+1)+' de '+imgs.length+'…');const m=imgs[i];if(!(m.w>1||m.h>1))[m.w,m.h]=await dims(m.f,m.url);parts.push((i?',':'')+JSON.stringify({w:m.w,h:m.h,d:await b2d(m.f)}))}
  parts.push(']}');
  const bl=new Blob(parts,{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(bl);a.download=id+'.mood.json';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);msg('Arquivo gerado: '+id+'.mood.json');
 }catch(e){msg('Não foi possível gerar o arquivo.')}
 refresh();
};
function pv(){
 cancelAnimationFrame(pvRaf);pvT=[];const box=$('#pv');box.innerHTML='';box.style.setProperty('--r',S.r+'px');
 if(!imgs.length){box.innerHTML='<p class="empty">Adicione imagens para ver a prévia.</p>';return}
 const list=ord.filter(i=>imgs[i]).map(i=>imgs[i]),G=12,W=box.clientWidth,nr=Math.max(1,Math.min(S.rows,list.length)),
  fit=Math.max(40,(box.clientHeight-24-(nr-1)*G)/nr),H=Math.max(30,Math.min(S.h||400,fit)),rows=Array.from({length:nr},()=>[]);
 list.forEach((m,i)=>rows[i%nr].push(m));
 rows.forEach((l,ri)=>{
  const ws=l.map(m=>H*m.w/m.h),set=ws.reduce((a,b)=>a+b+G,0),reps=Math.max(2,Math.ceil(W/set)+1),row=document.createElement('div'),tr=document.createElement('div');
  row.className='row';tr.className='track';
  for(let k=0;k<reps;k++)l.forEach((m,i)=>{const d=document.createElement('div'),im=new Image();d.className='it';d.style.cssText='width:'+ws[i]+'px;height:'+H+'px';im.src=m.url;im.alt='';im.draggable=false;d.append(im);tr.append(d)});
  row.append(tr);box.append(row);pvT.push({tr,set,x:(ri*set*.37)%set});
 });
 pvLast=0;pvRaf=requestAnimationFrame(pvTick);
}
function pvTick(t){
 const dt=Math.min(.1,(t-(pvLast||t))/1000);pvLast=t;
 if(!document.hidden)pvT.forEach(o=>{o.x=(o.x+S.speed*dt)%o.set;o.tr.style.transform='translate3d('+(-o.x)+'px,0,0)'});
 pvRaf=requestAnimationFrame(pvTick);
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(pv,200)});
refresh();
</script>
</body>
</html>
